<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 680" width="100%" height="100%">
  <defs>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: bold; fill: #1e293b; }
    .node-text { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #1e293b; font-weight: 500; }
    .node-subtext { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #475569; }
    .arrow { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow2); }
  </style>

  <rect width="100%" height="100%" fill="#ffffff" rx="12"/>

  <!-- Step 1: 載入 -->
  <g transform="translate(40, 25)">
    <rect x="0" y="0" width="570" height="90" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4"/>
    <text x="20" y="24" class="title" fill="#475569">1. 資料載入階段</text>
    <g transform="translate(20, 35)" filter="url(#shadow2)">
      <rect x="0" y="0" width="530" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="15" y="26" class="node-text">讀取原始 CSV 資料 (主檔.csv, 共 2,012 筆)</text>
    </g>
  </g>

  <path d="M 325 125 L 325 155" class="arrow"/>

  <!-- Step 2: 清洗與校正 -->
  <g transform="translate(40, 160)">
    <rect x="0" y="0" width="570" height="150" rx="8" fill="#f0f9ff" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="20" y="24" class="title" fill="#0369a1">2. 資料清洗與校正引擎</text>
    <g transform="translate(20, 38)" filter="url(#shadow2)">
      <rect x="0" y="0" width="530" height="95" rx="6" fill="#ffffff" stroke="#38bdf8" stroke-width="1"/>
      <text x="15" y="22" class="node-text">• 重複資料排除：drop_duplicates() (移除 12 筆重複)</text>
      <text x="15" y="42" class="node-text">• 日期標準化：統一為 YYYY-MM-DD (處理三種混用格式)</text>
      <text x="15" y="62" class="node-text">• 離群值校正：偵測極端值並修正 100 倍小數點錯位</text>
      <text x="15" y="82" class="node-text">• 缺失值處理：關鍵欄位以中位數填補</text>
    </g>
  </g>

  <path d="M 325 320 L 325 350" class="arrow"/>

  <!-- Step 3: 特徵工程 -->
  <g transform="translate(40, 355)">
    <rect x="0" y="0" width="570" height="110" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="20" y="24" class="title" fill="#6d28d9">3. 特徵工程與指標計算</text>
    <g transform="translate(20, 38)" filter="url(#shadow2)">
      <rect x="0" y="0" width="530" height="55" rx="6" fill="#ffffff" stroke="#8b5cf6" stroke-width="1"/>
      <text x="15" y="22" class="node-text">• 單位成本 = 金額 ÷ 數量　|　單位能耗 = 耗時分鐘 ÷ 數量</text>
      <text x="15" y="40" class="node-subtext">完成月份與製程分群彙總，識別成本異常高峰</text>
    </g>
  </g>

  <path d="M 325 475 L 325 505" class="arrow"/>

  <!-- Step 4: 輸出與應用 -->
  <g transform="translate(40, 510)">
    <rect x="0" y="0" width="570" height="120" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="20" y="24" class="title" fill="#047857">4. 輸出與應用</text>
    <g transform="translate(20, 38)" filter="url(#shadow2)">
      <rect x="0" y="0" width="530" height="65" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="1"/>
      <text x="15" y="22" class="node-text">產出淨化後的結構化資料 (cleaned_data.json)</text>
      <text x="15" y="42" class="node-subtext">支援 Streamlit 雲端儀表板與前端互動展示</text>
    </g>
  </g>
</svg>
